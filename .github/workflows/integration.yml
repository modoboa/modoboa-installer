name: Integration

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install a mail server
        run: |
          sudo python3 run.py --force --skip-checks example.test
      - name: Check the mail server
        run: |
          sudo bash .github/scripts/check-install.sh
